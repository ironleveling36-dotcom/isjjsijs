<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toing — User Panel</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .customer { max-width: 520px; }
    .customer h1 { font-size: 22px; color: #fc8019; }
    .key { font-size: 18px; letter-spacing: 1px; color: #fc8019; font-weight: 700; }
    .hidden { display: none; }
    img.qr { width: 220px; height: 220px; background: #fff; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container customer">
    <div class="card">
      <h1>Toing</h1>
      <div class="meta">Key: <span id="key-label" class="key">—</span> · <span id="sync-status">Idle</span></div>
      <div class="meta">Device: <span id="active-device-id">None</span></div>
    </div>

    <div class="card" id="gate">
      <h2>Access Key</h2>
      <div class="row">
        <input id="phone-input" type="tel" maxlength="10" placeholder="Mobile number" />
        <button id="btn-new-key">Generate Key</button>
      </div>
      <div class="row">
        <input id="key-input" type="text" placeholder="8281-THAN-81IQ" />
        <button id="btn-enter-key" class="secondary">Enter</button>
      </div>
      <div id="auth-log" class="meta">Generate a key, then JSON-login that account.</div>
    </div>

    <div id="panel" class="hidden">
      <div class="card">
        <h2>1. JSON Login</h2>
        <textarea id="session-json" rows="4" placeholder='{"tid":"...","sid":"...","csrfToken":"...","cookies":{}}'></textarea>
        <div class="row" style="margin-top:10px;">
          <button id="btn-json-login">Apply JSON Session</button>
        </div>
      </div>

      <div class="card">
        <h2>2. Address</h2>
        <div class="row">
          <input id="addr-input" type="text" placeholder="Full address" />
        </div>
        <div class="row">
          <input id="lat-input" type="text" placeholder="Lat" value="13.0827" />
          <input id="lng-input" type="text" placeholder="Lng" value="80.2707" />
          <button id="btn-add-address">Add Address</button>
          <button id="btn-sync-address" class="secondary">Sync Swiggy</button>
        </div>
        <div id="address-box" class="meta">No address.</div>
      </div>

      <div class="card">
        <h2>3. Open Nearby</h2>
        <button id="btn-restaurants">Load Open Restaurants</button>
        <div id="restaurants-box" class="meta">No restaurants.</div>
      </div>

      <div class="card">
        <h2>4. Menu & Add Food</h2>
        <div id="menu-box" class="meta">Pick a restaurant.</div>
      </div>

      <div class="card">
        <h2>5. Cart & Coupon</h2>
        <div id="live-cart-box">Cart empty.</div>
        <div class="row" style="margin-top:10px;">
          <button id="btn-coupons" class="secondary">Load Coupons</button>
          <button id="btn-best">Apply Best</button>
        </div>
        <div id="coupon-box" class="meta">No coupons.</div>
        <div id="amount-box" class="meta">Final amount: —</div>
      </div>

      <div class="card">
        <h2>6. Pay</h2>
        <button id="btn-pay">Pay with UPI</button>
        <div id="qr-box" class="meta"></div>
      </div>

      <div class="card">
        <h2>7. Tracking</h2>
        <div id="live-payment-box">No order.</div>
        <div id="track-link" class="meta"></div>
        <button id="btn-manual-payment" class="secondary">Refresh Tracking</button>
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
